[workspace]
members = ["atomic", "integration"]
resolver = "2"

# The oracle ships without [patch.crates-io]: the runner appends it, pointing
# rrule at the candidate workspace (member-manifest patches are ignored by
# cargo, so the patch lives on this root manifest).
[workspace.dependencies]
# `version = "*"` so the patched workspace version satisfies the requirement.
# Default configuration per the spec's Appendix A (no extra cargo features).
rrule = { version = "*" }
chrono = { version = "0.4" }
chrono-tz = { version = "0.10" }
