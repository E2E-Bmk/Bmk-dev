[workspace]
members = ["atomic", "integration"]
resolver = "2"

[workspace.dependencies]
cargo-generate = { version = "0.23", features = ["vendored-openssl"] }
anyhow = "1"
assert_cmd = "2"
bstr = "1"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
gix-config = "0.42"
indoc = "2"
log = "0.4"
names = "0.14"
predicates = "3"
tempfile = "3"
time = "0.3"
url = "2"
